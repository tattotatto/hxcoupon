server:
  port: 8080
  mode: debug
  static_dir: ""
  read_timeout: 10s
  write_timeout: 10s

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  name: hxcoupon
  charset: utf8mb4
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600s

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  pool_size: 100

jwt:
  secret: "change-me-to-a-random-string"
  access_token_ttl: 15m
  refresh_token_ttl: 168h

store_auth:
  timestamp_tolerance: 300

coupon:
  code_prefix_universal: "TY000"
  code_random_length: 6

log:
  level: info
  format: json
  output: stdout

oss:
  access_key_id: ""      # set via OSS_ACCESS_KEY_ID env
  access_key_secret: ""  # set via OSS_ACCESS_KEY_SECRET env
  endpoint: "oss-cn-chengdu.aliyuncs.com"
  bucket: "ynhx"
  domain: "https://ynhx.oss-cn-chengdu.aliyuncs.com"
