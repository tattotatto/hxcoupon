services:
  redis:
    image: redis:7-alpine
    container_name: hxcoupon-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}

  app:
    build: .
    container_name: hxcoupon-app
    restart: always
    ports:
      - "9000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_MODE: ${SERVER_MODE:-release}
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: "3306"
      DATABASE_USER: ${DB_USER:-root}
      DATABASE_PASSWORD: ${DB_PASSWORD:-}
      DATABASE_NAME: ${DB_NAME:-hxcoupon}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string}
      SERVER_STATIC_DIR: /static
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-chengdu.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-ynhx}
      OSS_DOMAIN: ${OSS_DOMAIN:-https://ynhx.oss-cn-chengdu.aliyuncs.com}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
